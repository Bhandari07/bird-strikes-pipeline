name: Assessment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: python -m pip install -r requirements-local-dbt.txt
      - run: python scripts/local_dbt.py
